# https://developers.cloudflare.com/workers/wrangler/configuration/
name = "greenwood-demo-adapter-cloudflare"
# Generated by Greenwood's Cloudflare adapter as the Worker's entry point.
main = "./functions/worker.js"
# https://blog.cloudflare.com/workers-module-registry-nodejs/
compatibility_flags = ["new_module_registry"]
compatibility_date = "2026-10-03"
no_bundle = true
# Enable workers.dev preview URLs
# https://developers.cloudflare.com/workers/previews/custom-domains/#enable-workersdev-preview-urls
preview_urls = true

# https://developers.cloudflare.com/workers/wrangler/configuration/#bundling
[[rules]]
type = "ESModule"
globs = ["**/*.js"]
fallthrough = true

# https://developers.cloudflare.com/workers/static-assets/binding/
[assets]
directory = "./public"
binding = "ASSETS"

# https://developers.cloudflare.com/dynamic-workers/getting-started/#configure-worker-loader
# Requires Workers Paid; each isolated request creates a billable Dynamic Worker.
# https://developers.cloudflare.com/dynamic-workers/pricing/
# Keep this name and the Preview binding in sync with ISOLATION_BINDING in cloudflare-adapter.js.
[[worker_loaders]]
binding = "GREENWOOD_ISOLATION"

# Required by wrangler preview for deploy previews
[previews]

# Worker Loader bindings are configured separately for Previews.
[[previews.worker_loaders]]
binding = "GREENWOOD_ISOLATION"

[previews.observability]
enabled = true

[previews.observability.logs]
enabled = true
invocation_logs = true
persist = true
